name: Market Monitor

on:
  schedule:
    - cron: "30 2 * * 1-5"    # 8:30 AM IST
    - cron: "20 3 * * 1-5"    # 9:20 AM IST
    - cron: "30 14 * * 1-5"   # 8:30 PM IST
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "catch_up"
        type: choice
        options:
          - catch_up
          - pre_market
          - market_open
          - eod_report

jobs:
  pre_market:
    if: github.event_name == 'schedule' && github.event.schedule == '30 2 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install requests beautifulsoup4 pillow pytz
      - run: python MarketUpdate/Pre_market.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MARKET_CHAT_ID: ${{ secrets.MARKET_CHAT_ID }}

  market_open:
    if: github.event_name == 'schedule' && github.event.schedule == '20 3 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install requests beautifulsoup4 pillow pytz
      - run: python MarketUpdate/Market_open.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MARKET_CHAT_ID: ${{ secrets.MARKET_CHAT_ID }}

  eod_report:
    if: github.event_name == 'schedule' && github.event.schedule == '30 14 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install requests beautifulsoup4 pillow pytz
      - run: python MarketUpdate/Eod_report.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MARKET_CHAT_ID: ${{ secrets.MARKET_CHAT_ID }}

  manual_run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install requests beautifulsoup4 pillow pytz
      - name: Run manual / catch-up mode
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MARKET_CHAT_ID: ${{ secrets.MARKET_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          python - <<'PY'
          import os, subprocess
          from datetime import datetime
          import pytz

          mode = os.environ["MODE"]
          ist = pytz.timezone("Asia/Kolkata")
          now = datetime.now(ist)
          current_minutes = now.hour * 60 + now.minute

          pre_market_time  = 8 * 60 + 30
          market_open_time = 9 * 60 + 20
          eod_time         = 20 * 60 + 30

          print(f"Current IST time: {now.strftime('%Y-%m-%d %I:%M %p')}")

          def run_script(script):
              print(f"\n>>> Running {script}")
              subprocess.run(["python", script], check=True)

          if mode == "pre_market":
              run_script("MarketUpdate/Pre_market.py")
          elif mode == "market_open":
              run_script("MarketUpdate/Market_open.py")
          elif mode == "eod_report":
              run_script("MarketUpdate/Eod_report.py")
          elif mode == "catch_up":
              if current_minutes >= pre_market_time:
                  run_script("MarketUpdate/Pre_market.py")
              else:
                  print("Skipping Pre_market.py (time not reached yet)")
              if current_minutes >= market_open_time:
                  run_script("MarketUpdate/Market_open.py")
              else:
                  print("Skipping Market_open.py (time not reached yet)")
              if current_minutes >= eod_time:
                  run_script("MarketUpdate/Eod_report.py")
              else:
                  print("Skipping Eod_report.py (time not reached yet)")
          else:
              raise ValueError(f"Unknown mode: {mode}")
          PY
